# styrigx-book-api：书库接口 Worker（CI 部署；承接 book.styrigx.com/api/*）
#
# 书库全部后端代码都在本目录：src/（入口、路由表、接口）+ migrations/（D1）。
# Pages（styrigx-book，配置见 web/wrangler.toml）只放静态文件；页面的会话检查在主站鉴权网关。
#
# 安全：
# - 本 Worker 不持任何钥匙。会话、应用通行证交给鉴权网关验（服务绑定 AUTH → SessionVerifier）。
# - workers_dev = false、preview_urls = false：只通过 book.styrigx.com 的路由访问（它连的是正式 R2/D1）。

name = "styrigx-book-api"
main = "src/index.js"
compatibility_date = "2026-10-08"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

# 路由：book.styrigx.com/api/*。网关另有更精确的 book.styrigx.com/api/session-check（精确路径优先），
# 书库页面路径登记在网关（styrigx-space 仓库 workers/auth-gateway/wrangler.toml），这里只管接口。
[[routes]]
pattern = "book.styrigx.com/api/*"
zone_name = "styrigx.com"

[vars]
MAX_UPLOAD_MB = "500"
STORAGE_ENABLED = "true"

[[r2_buckets]]
binding = "BOOKS"
bucket_name = "styrigx-books"

[[d1_databases]]
binding = "DB"
database_name = "styrigx-books"
database_id = "569d8caf-e315-471b-a080-4b9f055de5fa"
migrations_dir = "migrations"

# 验票：主站鉴权网关的 RPC 入口（session / appPass / appEpoch）。网关要先部署出 SessionVerifier。
[[services]]
binding = "AUTH"
service = "styrigx-auth-gateway"
entrypoint = "SessionVerifier"
