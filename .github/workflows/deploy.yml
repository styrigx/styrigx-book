name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no legacy key names
        run: |
          # 禁止旧变量名：SGX_ED25519_*（已改名为 SGX_LOCK_*），SGX_STEPUP_KEY（已改名为 SGX_STEPUP_PRIVATE）
          # 注意：不扫描 .github/，避免匹配到本文件自身的注释
          if grep -rn "SGX_ED25519_" --include="*.js" --include="*.mjs" --include="*.toml" functions/ tests/ scripts/ static/ layouts/ 2>/dev/null; then
            echo "ERROR: Found SGX_ED25519_* (use SGX_LOCK_* per key spec v1.0)."
            exit 1
          fi
          if grep -rn "SGX_ED25519_" wrangler.toml 2>/dev/null; then
            echo "ERROR: Found SGX_ED25519_* in wrangler.toml."
            exit 1
          fi
          if grep -rn "SGX_STEPUP_KEY" --include="*.js" --include="*.mjs" --include="*.toml" functions/ tests/ scripts/ static/ layouts/ 2>/dev/null; then
            echo "ERROR: Found SGX_STEPUP_KEY (use SGX_STEPUP_PRIVATE per key spec v1.0)."
            exit 1
          fi
          if grep -rn "SGX_STEPUP_KEY" wrangler.toml 2>/dev/null; then
            echo "ERROR: Found SGX_STEPUP_KEY in wrangler.toml."
            exit 1
          fi
          echo "OK: no legacy key names."

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Vendor reader libs
        run: node scripts/vendor.mjs

      - name: Build CSS
        run: npx tailwindcss -i assets/css/input.css -o assets/css/main.css --minify

      - name: Run tests
        run: npm test

      - name: Key distribution static check (2.10.0)
        # book 是子站：functions/ 里不得出现任何 *_PRIVATE 或 SGX_STEPUP_*。
        # 私钥只在主站，STEPUP 密钥对只在主站。出现即构建失败。
        run: |
          if grep -rn --include="*.js" -E "_PRIVATE|SGX_STEPUP_" functions/; then
            echo "FAIL: functions/ must not contain *_PRIVATE or SGX_STEPUP_"
            exit 1
          fi
          echo "key distribution check passed"

      - name: Build site
        run: hugo --minify

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=styrigx-book --commit-dirty=true
